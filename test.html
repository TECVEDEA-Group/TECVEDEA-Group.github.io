<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECVEDEA Logo Test</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #000;
        }

        .logo-wheel {
            width: 260px;
            height: 260px;

            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Rotating wheel / border */
        .logo-wheel::before {
            content: "";

            position: absolute;
            inset: 0;

            border: 7px solid transparent;
            border-top-color: #fff;
            border-right-color: #fff;

            border-radius: 50%;

            animation: rotateWheel 2s linear infinite;
        }

        /* Center logo — DOES NOT rotate */
        .logo {
            width: 150px;
            height: 150px;

            object-fit: contain;

            position: relative;
            z-index: 2;
        }

        @keyframes rotateWheel {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="logo-wheel">

        <img
            src="logo.png"
            alt="TECVEDEA"
            class="logo"
        >

    </div>

</body>
</html>
